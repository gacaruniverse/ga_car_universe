<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="logo" href="{{ url_for('static', filename='images/logo.png')}}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GA CAR UNIVERSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <h1 class="brand-title">GA CAR UNIVERSE</h1>
        
        <div class="card-box">
            <!-- Tabs -->
            <div class="tab-container" id="tabContainer">
                <button class="tab-btn active" onclick="switchForm('login')">Login</button>
                <button class="tab-btn" onclick="switchForm('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" action="/login" method="POST">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-main">LOG IN</button>
                <a href="#" class="forgot-link" onclick="switchForm('forgot')">Forgot Password?</a>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" action="/register" method="POST" onsubmit="return validateRegister()">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Choose Username" required>
                </div>
                <div class="input-group">
                    <i class="fab fa-whatsapp"></i>
                    <input type="text" name="whatsapp" placeholder="WhatsApp Number" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg_pass" name="password" placeholder="Create Password" required>
                </div>
                <button type="submit" class="btn-main">REGISTER</button>
            </form>

            <!-- Forgot Password Verification / Reset Form -->
            <form id="forgotForm" class="auth-form" action="/forgot" method="POST">
                <p class="form-text">Verify details to unlock reset field.</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Your Username" required>
                </div>
                <div class="input-group">
                    <i class="fab fa-whatsapp"></i>
                    <input type="text" name="whatsapp" placeholder="Registered WhatsApp Number" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="password" name="new_password" placeholder="Enter New Password" required>
                </div>
                <button type="submit" class="btn-main">VERIFY & RESET</button>
                <a href="#" class="forgot-link" onclick="switchForm('login')">Back to Login</a>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

    <!-- Flash Messages to Toast Converter -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <script>
          window.addEventListener('DOMContentLoaded', () => {
            {% for message in messages %}
              showToast("{{ message }}", "info");
            {% endfor %}
          });
        </script>
      {% endif %}
    {% endwith %}
</body>
</html>
